<!DOCTYPE html>
<html>
<head>
<title>별 문자 출력하기</title>
<script>
	function printStar(num) {
		if(isNaN(num)){
			document.write("입력 오류 입니다.");
		}

		for(var i=1;i<=num;i++){
			for(var j=1;j<=i;j++){
				document.write("*");
			}
		document.write("<br>");	
		}
	}
</script>
</head>
<body>
<h3>별 문자 출력하기</h3>
<hr>
<script>
	var num = prompt("정수를 입력하세요");
	printStar(num);
</script>
</body>
</html>
